[package]
name = "jiaxin2006-tg-rcore-tutorial-user-t4"
description = "Custom T4 user-space apps for rCore Tutorial: interrupt/SMP checks, Doom helpers, and performance benchmarks."
version = "0.0.4-preview.1"
edition = "2024"
authors = ["Jiaxin Han <hanjx23@mails.tsinghua.edu.cn>"]
repository = "https://github.com/Jiaxin2006/tg-rcore-tutorial"
homepage = "https://github.com/Jiaxin2006/tg-rcore-tutorial/tree/test/tg-rcore-tutorial-user"
documentation = "https://docs.rs/jiaxin2006-tg-rcore-tutorial-user-t4"
license = "GPL-3.0"
readme = "README.md"
keywords = ["rcore", "tutorial", "no-std", "riscv", "user-apps"]
categories = ["no-std", "embedded"]

[lib]
name = "user_lib"
path = "src/lib.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
tg-console = { package = "tg-rcore-tutorial-console", path = "../tg-rcore-tutorial-console", version = "0.4.2-preview.7" }
tg-syscall = { package = "jiaxin2006-tg-rcore-tutorial-syscall-t4", path = "../syscall-t3l8", version = "0.0.4-preview.1", features = ["user"] }
customizable-buddy = "0.0.2"
