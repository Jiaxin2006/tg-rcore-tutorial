[package]
name = "jiaxin2006-tg-rcore-tutorial-sync-t1l5"
description = "Synchronization primitives for rCore tutorial OS, including mutex, semaphore, and condvar."
version = "0.0.1-preview.1"
edition = "2024"
authors = ["Jiaxin Han <hanjx23@mails.tsinghua.edu.cn>"]
repository = "https://github.com/Jiaxin2006/tg-rcore-tutorial"
homepage = "https://github.com/Jiaxin2006/tg-rcore-tutorial/tree/test/tg-rcore-tutorial-sync"
documentation = "https://docs.rs/jiaxin2006-tg-rcore-tutorial-sync-t1l5"
license = "GPL-3.0"
readme = "README.md"
keywords = ["rcore", "sync", "mutex", "riscv"]
categories = ["no-std", "embedded", "concurrency"]

[dependencies]
riscv = "0.10"
spin = "0.9"
tg-task-manage = { package = "jiaxin2006-tg-rcore-tutorial-task-manage-t4", path = "../tg-rcore-tutorial-task-manage", version = "0.0.4-preview.1" }
