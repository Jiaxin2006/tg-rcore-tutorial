[package]
name = "jiaxin2006-tg-rcore-tutorial-t2l5"
description = "Student AI4OSE lab crate for Experiment 5 of rCore Tutorial: synchronization primitives (SpinLock, MutexBlocking, Semaphore, Condvar, RwLock) with instrumentation metrics."
version = "0.0.4-preview.1"
edition = "2024"
authors = ["Jiaxin Han <hanjx23@mails.tsinghua.edu.cn>"]
repository = "https://github.com/Jiaxin2006/tg-rcore-tutorial"
homepage = "https://github.com/Jiaxin2006/tg-rcore-tutorial/tree/test/exp5-sync"
documentation = "https://docs.rs/jiaxin2006-tg-rcore-tutorial-t2l5"
license = "GPL-3.0"
readme = "docs/exp5.md"
keywords = ["ai", "ai4ose", "kernel", "learning", "os"]
categories = ["algorithms", "concurrency"]
exclude = [
    "target/**",
]

[features]
default = ["std"]
std = []
kernel = ["dep:riscv", "dep:spin", "dep:tg-task-manage"]

[dependencies]
riscv = { version = "0.10", optional = true }
spin = { version = "0.9", optional = true }
tg-task-manage = { package = "jiaxin2006-tg-rcore-tutorial-task-manage-t4", path = "../tg-rcore-tutorial-task-manage", version = "0.0.4-preview.1", optional = true }
